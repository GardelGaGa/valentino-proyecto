<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FocusLab — Tareas</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  
  <style>
    :root {
      /* Paleta de FocusLab */
      --bg:          #080c10;
      --surface:     #0e1318;
      --surface-2:   #141c24;
      --surface-3:   #1c2835;
      --border:      rgba(255,255,255,0.06);
      --border-mid:  rgba(255,255,255,0.12);
      
      --accent:      #00e5a0; /* Verde neón */
      --accent-blue: #00b4d8; /* Cian/Azul */
      --accent-red:  #ff4d6d;
      --accent-warn: #ffb830;
      
      --text-1:      #e8eef4;
      --text-2:      #7a93a8;
      --text-3:      #3d5366;
      
      --sidebar-w:   250px;
      --transition:  0.22s cubic-bezier(0.4, 0, 0.2, 1);
      --radius:      14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Instrument Sans', sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      display: flex;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 3px; }

    /* ─── SIDEBAR (Heredado de index) ─── */
    .sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; }
    .sidebar-brand { padding: 28px 24px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .logo-mark { width: 32px; height: 32px; background: var(--surface-3); border: 1px solid var(--border-mid); border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px rgba(0,229,160,0.12); }
    .logo-mark svg { width: 16px; height: 16px; color: var(--accent); }
    .brand-text .logo { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text-1); line-height: 1; }
    .brand-text .logo em { font-style: normal; color: var(--accent); }
    .brand-text .tagline { font-size: 0.65rem; color: var(--text-3); font-family: 'Space Mono', monospace; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    
    .nav-section { flex: 1; padding: 20px 0; overflow-y: auto; }
    .nav-section-label { display: block; font-size: 0.65rem; font-family: 'Space Mono', monospace; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.1em; padding: 0 24px 10px; }
    .nav-item { list-style: none; margin-bottom: 4px; }
    .nav-link { display: flex; align-items: center; gap: 12px; padding: 10px 24px; color: var(--text-2); text-decoration: none; font-size: 0.88rem; font-weight: 500; border-left: 2px solid transparent; transition: all var(--transition); }
    .nav-link:hover { color: var(--text-1); background: var(--surface-2); }
    .nav-link.active { color: var(--accent); border-left-color: var(--accent); background: linear-gradient(90deg, rgba(0,229,160,0.08), transparent); }
    .nav-link i { width: 18px; text-align: center; font-size: 0.9rem; }
    
    .sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border); background: var(--surface); }
    .sidebar-user { display: flex; align-items: center; justify-content: space-between; padding: 8px; border-radius: 10px; transition: background var(--transition); }
    .sidebar-user:hover { background: var(--surface-2); }
    .user-info-wrap { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, var(--surface-3), var(--surface-2)); border: 1px solid var(--border-mid); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 600; color: var(--accent); font-family: 'Syne', sans-serif; }
    .user-info .name { font-size: 0.82rem; font-weight: 600; color: var(--text-1); }
    .user-info .role { font-size: 0.65rem; color: var(--accent-blue); font-family: 'Space Mono', monospace; }
    .btn-logout { background: none; border: none; color: var(--text-3); cursor: pointer; padding: 6px; border-radius: 6px; transition: all var(--transition); }
    .btn-logout:hover { color: var(--accent-red); background: rgba(255,77,109,0.1); }

    /* ─── MAIN & TOPBAR ─── */
    .main { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; display: flex; flex-direction: column; position: relative; }
    .main::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(0,229,160,0.03) 0%, transparent 70%); }
    
    .topbar { background: rgba(14, 19, 24, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 16px 36px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
    .topbar-title { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--text-1); }
    .topbar-date { font-size: 0.72rem; color: var(--text-2); font-family: 'Space Mono', monospace; margin-top: 4px; }
    .topbar-actions { display: flex; align-items: center; gap: 16px; }

    /* ─── BOTONES GLOBALES ─── */
    .btn-action { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border-mid); background: var(--surface-2); color: var(--text-1); font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all var(--transition); }
    .btn-action:hover { border-color: var(--accent-blue); background: rgba(0,180,216,0.06); color: var(--accent-blue); }
    
    .btn-primary { background: linear-gradient(135deg, var(--accent) 0%, var(--accent-blue) 100%); color: #050a07; border: none; font-family: 'Syne', sans-serif; font-weight: 700; box-shadow: 0 4px 14px rgba(0,229,160,0.2); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,229,160,0.3); color: #050a07; }

    .content { padding: 32px 36px; flex: 1; }

    /* ─── TABLA DE TAREAS (ESTILO NOTION) ─── */
    .task-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .task-title { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    
    .table-card {
      background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; animation: fadeUp 0.4s ease both; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    .table { width: 100%; border-collapse: collapse; text-align: left; }
    .table th {
      background: var(--surface-3); padding: 14px 20px; font-family: 'Space Mono', monospace;
      font-size: 0.75rem; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border); font-weight: 700;
    }
    
    .table td {
      padding: 14px 20px; border-bottom: 1px solid var(--border-mid); vertical-align: middle;
      font-size: 0.9rem; transition: background 0.2s;
    }
    .table tbody tr { transition: background var(--transition); }
    .table tbody tr:hover { background: rgba(255,255,255,0.02); }
    .table tbody tr:last-child td { border-bottom: none; }

    /* Campos editables */
    .editable-cell { outline: none; border-radius: 6px; padding: 6px 10px; margin: -6px -10px; transition: all 0.2s; border: 1px solid transparent; }
    .editable-cell:hover { background: var(--surface-3); }
    .editable-cell:focus { background: var(--surface-3); border-color: rgba(0,180,216,0.5); box-shadow: 0 0 0 2px rgba(0,180,216,0.1); }

    /* ─── BADGES ─── */
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 600; font-family: 'Space Mono', monospace; border: 1px solid transparent;
      cursor: pointer; transition: all 0.2s; user-select: none;
    }
    
    /* Estados */
    .badge-pending { background: rgba(255,184,48,0.1); color: var(--accent-warn); border-color: rgba(255,184,48,0.2); }
    .badge-done    { background: rgba(0,229,160,0.1);  color: var(--accent);      border-color: rgba(0,229,160,0.2); }
    
    /* Prioridades */
    .badge-high    { background: rgba(255,77,109,0.1); color: var(--accent-red);  border-color: rgba(255,77,109,0.2); }
    .badge-medium  { background: rgba(0,180,216,0.1);  color: var(--accent-blue); border-color: rgba(0,180,216,0.2); }
    .badge-low     { background: rgba(255,255,255,0.05); color: var(--text-2);    border-color: rgba(255,255,255,0.1); }

    .badge:hover { filter: brightness(1.2); transform: scale(1.05); }

    /* ─── BOTONES MINI ─── */
    .btn-mini {
      background: none; border: none; padding: 6px; border-radius: 6px; cursor: pointer;
      color: var(--text-3); transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center;
    }
    .btn-mini.check:hover { color: var(--accent); background: rgba(0,229,160,0.1); }
    .btn-mini.delete:hover { color: var(--accent-red); background: rgba(255,77,109,0.1); }

  </style>
</head>

<body>

<script>
  if (!localStorage.getItem("focus_session")) {
    window.location.href = "login.html";
  }
</script>

<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <polyline points="12 7 12 12 15 14"/>
      </svg>
    </div>
    <div class="brand-text">
      <div class="logo">Focus<em>Lab</em></div>
      <div class="tagline">workspace</div>
    </div>
  </div>

  <div class="nav-section">
    <span class="nav-section-label">Menú Principal</span>
    <ul style="padding:0;">
      <li class="nav-item">
        <a class="nav-link" href="index.html">
          <i class="fas fa-home"></i> Inicio
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" href="tables.html">
          <i class="fas fa-tasks"></i> Tareas
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="charts.html">
          <i class="fas fa-chart-line"></i> Analítica
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="focus.html">
          <i class="fas fa-bullseye"></i> Modo Focus
        </a>
      </li>
    </ul>
  </div>

  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div class="user-info-wrap">
        <div class="avatar" id="avatar-initials">--</div>
        <div class="user-info">
          <div class="name" id="username">Cargando…</div>
          <div class="role">Pro · Activo</div>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()" title="Cerrar sesión">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </div>
</aside>

<div class="main">

  <nav class="topbar">
    <div>
      <div class="topbar-title">Gestión de Tareas</div>
      <div class="topbar-date" id="current-date"></div>
    </div>
  </nav>

  <div class="content">

    <div class="task-header">
      <div class="task-title">
        <i class="fas fa-layer-group" style="color: var(--accent-blue);"></i> Backlog de Tareas
      </div>
      <button class="btn-action btn-primary" onclick="addTask()">
        <i class="fas fa-plus"></i> Nueva Tarea
      </button>
    </div>

    <div class="table-card">
      <table class="table">
        <thead>
          <tr>
            <th style="width: 50%;">Nombre de la tarea</th>
            <th>Estado</th>
            <th>Prioridad</th>
            <th style="text-align: center;">Acciones</th>
          </tr>
        </thead>
        <tbody id="taskTable">
          </tbody>
      </table>
    </div>

  </div>
</div>

<script>
  /* =========================
     USER & UI LOGIC
  ========================= */
  const user = localStorage.getItem("focus_user") || "Usuario Local";
  document.getElementById("username").textContent = user;
  const initials = user.split(" ").map(w => w[0]).join("").toUpperCase().slice(0,2);
  document.getElementById("avatar-initials").textContent = initials || "FL";

  const dateEl = document.getElementById("current-date");
  const now = new Date();
  const options = { weekday: "long", year: "numeric", month: "long", day: "numeric" };
  const formattedDate = now.toLocaleDateString("es-MX", options);
  dateEl.textContent = formattedDate.charAt(0).toUpperCase() + formattedDate.slice(1);

  function logout() {
      if(confirm("¿Estás seguro de que deseas cerrar sesión?")) {
          localStorage.removeItem("focus_session");
          localStorage.removeItem("focus_user");
          window.location.href = "login.html";
      }
  }

  /* =========================
     BASE DE DATOS LOCAL
  ========================= */
  let tasks = JSON.parse(localStorage.getItem("focus_tasks")) || [
      { text: "Implementar autenticación en frontend", status: "Hecho", priority: "Alta" },
      { text: "Diseñar el dashboard de analíticas", status: "Pendiente", priority: "Alta" },
      { text: "Refactorizar estilos globales", status: "Pendiente", priority: "Media" },
      { text: "Actualizar Readme.md del repositorio", status: "Pendiente", priority: "Baja" }
  ];

  function save() {
      localStorage.setItem("focus_tasks", JSON.stringify(tasks));
  }

  /* =========================
     RENDER
  ========================= */
  function render() {
      let table = document.getElementById("taskTable");
      table.innerHTML = "";

      if(tasks.length === 0) {
          table.innerHTML = `<tr><td colspan="4" style="text-align:center; color: var(--text-3); padding: 40px;">No hay tareas pendientes. ¡Buen trabajo! 🎉</td></tr>`;
          return;
      }

      tasks.forEach((task, index) => {
          // Asignar clases de colores basadas en los valores
          let statusCls = task.status === "Hecho" ? "badge-done" : "badge-pending";
          let statusIcon = task.status === "Hecho" ? "fas fa-check-circle" : "fas fa-circle-notch fa-spin";
          
          let priorityCls = "badge-low";
          if(task.priority === "Alta") priorityCls = "badge-high";
          else if(task.priority === "Media") priorityCls = "badge-medium";

          // Prevenir saltos de línea al editar
          let cleanText = task.text.replace(/<[^>]*>?/gm, '');

          table.innerHTML += `
          <tr>
              <td>
                  <div class="editable-cell" contenteditable="true" onblur="editTask(${index}, this.innerText)" onkeydown="if(event.key==='Enter'){this.blur(); return false;}">
                      ${cleanText}
                  </div>
              </td>
              <td>
                  <span class="badge ${statusCls}" onclick="toggleStatus(${index})" title="Clic para cambiar">
                      <i class="${statusIcon}"></i> ${task.status}
                  </span>
              </td>
              <td>
                  <span class="badge ${priorityCls}" onclick="cyclePriority(${index})" title="Clic para cambiar">
                      ${task.priority}
                  </span>
              </td>
              <td style="text-align: center;">
                  <button class="btn-mini check" onclick="toggleStatus(${index})" title="Marcar/Desmarcar">
                      <i class="fas fa-check"></i>
                  </button>
                  <button class="btn-mini delete" onclick="removeTask(${index})" title="Eliminar">
                      <i class="fas fa-trash"></i>
                  </button>
              </td>
          </tr>
          `;
      });
  }

  /* =========================
     ACCIONES
  ========================= */
  function editTask(i, value) {
      if(value.trim() === "") {
          removeTask(i); // Si lo deja vacío, se borra.
      } else {
          tasks[i].text = value.trim();
          save();
      }
  }

  function toggleStatus(i) {
      tasks[i].status = tasks[i].status === "Hecho" ? "Pendiente" : "Hecho";
      save();
      render();
  }

  function cyclePriority(i) {
      const p = tasks[i].priority;
      // Ciclo: Baja -> Media -> Alta -> Baja
      if(p === "Baja") tasks[i].priority = "Media";
      else if(p === "Media") tasks[i].priority = "Alta";
      else tasks[i].priority = "Baja";
      
      save();
      render();
  }

  function removeTask(i) {
      tasks.splice(i, 1);
      save();
      render();
  }

  function addTask() {
      tasks.unshift({ // Añade al principio de la lista
          text: "Nueva tarea (haz clic para editar)",
          status: "Pendiente",
          priority: "Media"
      });
      save();
      render();
  }

  /* INIT */
  render();
</script>

</body>
</html>

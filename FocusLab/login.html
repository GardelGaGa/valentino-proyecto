<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusLab — Iniciar sesión</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0d14;
      --surface:   #111520;
      --border:    rgba(255,255,255,0.07);
      --accent:    #4f8eff;
      --accent2:   #a78bfa;
      --text:      #e8eaf0;
      --muted:     #6b7280;
      --danger:    #f87171;
      --input-bg:  #181d2e;
      --radius:    14px;
      --font-head: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: var(--font-body);
      color: var(--text);
      overflow: hidden;
    }

    /* ── animated background ── */
    .bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      background: var(--bg);
      overflow: hidden;
    }
    .bg-canvas::before,
    .bg-canvas::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.18;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .bg-canvas::before {
      width: 600px; height: 600px;
      background: var(--accent);
      top: -200px; left: -200px;
    }
    .bg-canvas::after {
      width: 500px; height: 500px;
      background: var(--accent2);
      bottom: -150px; right: -100px;
      animation-delay: -6s;
    }
    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(40px,40px) scale(1.1); }
    }

    /* ── grid noise overlay ── */
    .noise {
      position: fixed; inset: 0; z-index: 1;
      background-image:
        linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* ── layout ── */
    .page {
      position: relative; z-index: 2;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 480px 1fr;
      grid-template-rows: 1fr;
      align-items: center;
      justify-items: center;
      padding: 24px;
    }

    /* ── card ── */
    .card {
      grid-column: 2;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 44px 40px 40px;
      box-shadow:
        0 0 0 1px rgba(79,142,255,.06),
        0 32px 64px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.06);
      animation: rise .55s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(28px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── header ── */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .logo-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-icon svg { width: 20px; height: 20px; }
    .logo-text {
      font-family: var(--font-head);
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .headline {
      font-family: var(--font-head);
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 6px;
    }
    .sub {
      color: var(--muted);
      font-size: .875rem;
      margin-bottom: 32px;
    }

    /* ── social buttons ── */
    .social-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 28px;
    }
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 0;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: .8rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .15s;
      text-decoration: none;
    }
    .social-btn:hover {
      border-color: rgba(255,255,255,.18);
      background: #1e2438;
      transform: translateY(-1px);
    }
    .social-btn svg { flex-shrink: 0; }

    /* ── divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      color: var(--muted);
      font-size: .75rem;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── form ── */
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: .78rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: .02em;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap .icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }
    .input-wrap input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: .9rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-wrap input::placeholder { color: #3a4060; }
    .input-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79,142,255,.15);
    }
    .input-wrap .toggle-pass {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 4px;
      transition: color .2s;
    }
    .input-wrap .toggle-pass:hover { color: var(--text); }

    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      margin-top: 4px;
    }
    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .8rem;
      color: var(--muted);
      cursor: pointer;
    }
    .remember input[type=checkbox] {
      appearance: none;
      width: 16px; height: 16px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      cursor: pointer;
      position: relative;
      transition: background .2s, border-color .2s;
    }
    .remember input[type=checkbox]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .remember input[type=checkbox]:checked::after {
      content: '';
      position: absolute;
      left: 4px; top: 1px;
      width: 6px; height: 10px;
      border: 2px solid #fff;
      border-top: none; border-left: none;
      transform: rotate(45deg);
    }
    .forgot {
      font-size: .8rem;
      color: var(--accent);
      text-decoration: none;
      transition: opacity .2s;
    }
    .forgot:hover { opacity: .75; }

    /* ── primary button ── */
    .btn-primary {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--accent) 0%, #6a5eff 100%);
      color: #fff;
      font-family: var(--font-body);
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform .15s, box-shadow .2s;
      box-shadow: 0 4px 24px rgba(79,142,255,.35);
    }
    .btn-primary::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(255,255,255,0);
      transition: background .2s;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(79,142,255,.45);
    }
    .btn-primary:hover::after { background: rgba(255,255,255,.07); }
    .btn-primary:active { transform: translateY(0); }

    /* ── footer ── */
    .card-footer {
      text-align: center;
      margin-top: 24px;
      font-size: .82rem;
      color: var(--muted);
    }
    .card-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: opacity .2s;
    }
    .card-footer a:hover { opacity: .75; }

    /* ── error msg ── */
    .error-msg {
      display: none;
      background: rgba(248,113,113,.1);
      border: 1px solid rgba(248,113,113,.3);
      color: var(--danger);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: .82rem;
      margin-bottom: 16px;
    }
    .error-msg.show { display: block; }

    @media (max-width: 560px) {
      .page { grid-template-columns: 1fr; padding: 16px; }
      .card { grid-column: 1; padding: 32px 24px 28px; }
      .social-grid { grid-template-columns: 1fr; }
      .headline { font-size: 1.45rem; }
      html, body { overflow: auto; }
    }
  </style>
</head>
<body>

<div class="bg-canvas"></div>
<div class="noise"></div>

<div class="page">
  <div class="card">

    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3L4 7v5c0 4.4 3.4 8.5 8 9.5 4.6-1 8-5.1 8-9.5V7l-8-4z" fill="white" opacity=".9"/>
        </svg>
      </div>
      <span class="logo-text">FocusLab</span>
    </div>

    <h1 class="headline">Bienvenido de nuevo</h1>
    <p class="sub">Inicia sesión para continuar en tu espacio de trabajo</p>

    <!-- Social logins -->
    <div class="social-grid">

      <button class="social-btn" onclick="handleSocial('Google')">
        <!-- Google -->
        <svg width="16" height="16" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Google
      </button>

      <button class="social-btn" onclick="handleSocial('GitHub')">
        <!-- GitHub -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58 0-.28-.01-1.03-.02-2.03-3.34.73-4.04-1.61-4.04-1.61-.54-1.39-1.33-1.75-1.33-1.75-1.09-.74.08-.73.08-.73 1.2.08 1.84 1.23 1.84 1.23 1.07 1.84 2.81 1.31 3.5 1 .1-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.17 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0 2.04.13 3 .4 2.28-1.55 3.29-1.23 3.29-1.23.66 1.65.24 2.87.12 3.17.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.92.43.37.81 1.1.81 2.22 0 1.6-.01 2.9-.01 3.29 0 .32.21.69.82.57C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        GitHub
      </button>

      <button class="social-btn" onclick="handleSocial('Microsoft')">
        <!-- Microsoft -->
        <svg width="16" height="16" viewBox="0 0 24 24">
          <rect x="1" y="1" width="10" height="10" fill="#f25022"/>
          <rect x="13" y="1" width="10" height="10" fill="#7fba00"/>
          <rect x="1" y="13" width="10" height="10" fill="#00a4ef"/>
          <rect x="13" y="13" width="10" height="10" fill="#ffb900"/>
        </svg>
        Microsoft
      </button>

    </div>

    <div class="divider">o continúa con email</div>

    <!-- Error -->
    <div class="error-msg" id="errorMsg">Usuario o contraseña incorrectos.</div>

    <!-- Form -->
    <form id="loginForm" onsubmit="handleLogin(event)" novalidate>

      <div class="field">
        <label for="loginUser">Correo electrónico</label>
        <div class="input-wrap">
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          <input type="email" id="loginUser" placeholder="tu@email.com" required autocomplete="email">
        </div>
      </div>

      <div class="field">
        <label for="loginPass">Contraseña</label>
        <div class="input-wrap">
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="loginPass" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar contraseña">
            <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="field-row">
        <label class="remember">
          <input type="checkbox" id="remember"> Recordarme
        </label>
        <a href="#" class="forgot">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-primary">Iniciar sesión</button>

    </form>

    <div class="card-footer">
      ¿No tienes cuenta? <a href="register.html">Crear cuenta gratis</a>
    </div>

  </div>
</div>

<script>
  // Toggle password visibility
  const togglePass = document.getElementById('togglePass');
  const loginPass  = document.getElementById('loginPass');
  const eyeIcon    = document.getElementById('eyeIcon');

  togglePass.addEventListener('click', () => {
    const show = loginPass.type === 'password';
    loginPass.type = show ? 'text' : 'password';
    eyeIcon.innerHTML = show
      ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`
      : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
  });

  // Login handler
  function handleLogin(e) {
    e.preventDefault();
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value;
    const err  = document.getElementById('errorMsg');

    err.classList.remove('show');

    if (!user || !pass) {
      err.textContent = 'Por favor completa todos los campos.';
      err.classList.add('show');
      return;
    }

if (typeof authLogin === 'function') {
  authLogin(user, pass);
} else {
  // Demo: simulamos éxito
  document.querySelector('.btn-primary').textContent = '✓ Entrando…';
  window.location.href = "index.html";
}
  }

  // Social handler placeholder
  function handleSocial(provider) {
    alert(`Inicio de sesión con ${provider} — conecta tu SDK aquí.`);
  }
</script>
